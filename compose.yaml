name: meraki

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: ./app
    dockerfile: Dockerfile
  image: meraki/app:local
  env_file:
    - .env
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    APP_ENV: development
    APP_URL: ${DEV_APP_URL:-http://localhost:50380}
    HOST: 0.0.0.0
    PORT: "50300"
  expose:
    - "50300"
  volumes:
    # SQLite + WAL + anexos no host. `:Z` para SELinux (Fedora/RHEL).
    - ${HOST_DATA_PATH:-./data}:/app/data:Z
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  ulimits:
    nofile:
      soft: 4096
      hard: 4096
  stop_grace_period: 20s
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD",
        "/bin/deno",
        "eval",
        "--no-config",
        "--allow-net",
        "const r = await fetch('http://127.0.0.1:50300/healthz'); if (!r.ok) Deno.exit(1);",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  logging: *logging

services:
  app:
    <<: *app

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      # Loopback por padrão; em produção atrás de LB, EDGE_BIND=0.0.0.0.
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-50380}:50380"
    volumes:
      - ./app/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A imagem oficial do Caddy tem cap_net_bind_service no binário.
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:50380/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
